openapi: 0.0.1
paths:
    /api/auth/signup/:
        post:
            tags: [Auth]
            summary: Sign up and start a session
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [username, password, email]
                            properties:
                                username: { type: string }
                                password: { type: string, format: password }
                                email: { type: string, format: email }
                                nickname: { type: string, nullable: true }
                                team: { type: string, nullable: true }
                    multipart/form-data:
                        schema:
                            type: object
                            properties:
                                profile_image: { type: string, format: binary }
            responses:
                "201":
                    description: Created
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    id: { type: integer }
                                    username: { type: string }
                                    email: { type: string }
                                    nickname: { type: string, nullable: true }
                                    team: { type: tring, nullable: true }
                                    profile_image: { type: string, nullable: true }
                "400": { description: Validation error (field-wise) } # 유효성 오류(필드별 에러)
    /api/auth/login/:
        post:
            tags: [Auth]
            summary: Login (session-based)
            description: |
                유효한 자격증명으로 로그인하고 세션을 시작.
                성공 시 Set-Cookie 헤더로 세션이 설정.
                (SessionAuthentication+CSRF를 쓰면 POST에 CSRF 토큰 필요)
            requestBody:
                required: true
                content:
                    application/json: # json으로 로그인
                        schema:
                            type: object
                            required: [username, password]
                            properties:
                                username: { type: string }
                                password: { type: string, format: password }
                        examples: # 문서/모킹용 예시 페이로드
                            ok:
                                value: {username: "tester1", password: "String!Pass" }
                    application/x-www-form-urlencoded: # html 폼 전송(format) 지원
                        schema:
                            type: object
                            required: [username, password]
                            properties:
                                username: { type: string }
                                password: { type: string }
            responses:
                "200":
                    description: 로그인 성공 (세션 생성)
                    headers:
                        Set-Cookie:
                            description: "세션 쿠키(ex. sessionid=...; Path=/; HttpOnly; Secure)"
                            schema: { type: string }
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    id: { type: integer }
                                    username: { type: string }
                                    email: { type: string, format: email }
                                    nickname: { type: string, nullable: true }
                                    team: { type: string, nullable: true }
                                    profile_image: { type: string, nullable: true}
                            examples:
                                ok:
                                    value:
                                        id: 123
                                        username: tester1
                                        email: t1@example.com
                                        nickname: null
                                        team: LG
                                        profile_image: null
                "400":
                    description: 요청 형식/필드 유효성 오류 (필수 누락 등)
                    content:
                        application/json:
                        schema:
                            type: object
                            properties:
                                detail: { type: string } # 일반 에러 메시지(상세)
                                errors:  # 필드별 오류 목록(키=필드명)
                                    type: object
                                    additionalProperties: # 어떤 필드명이 와도 허용
                                        type: array
                                        items: { type: string }
                        examples:
                            missing:
                                value:
                                    detail: "Invalid request."
                                    errors:
                                        username: ["필드가 누락되었습니다."]
                "401":
                    description: Unauthorized 인증 실패(아이디/비밀번호 불일치)
                    content:
                        application/json:
                        schema:
                            type: object
                            properties:
                                detail: { type: string }
                        examples:
                            invalid:
                                value:
                                    detail: "Invalid credentials."
                "429":
                    description: 레이트 리밋 초과(스로틀 적용 시) # 과도한 시도 방지