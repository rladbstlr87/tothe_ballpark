{% extends 'base.html' %}
{% block title %}{{ title }} | 직돌이{% endblock %}

{% block body %}
<main id="policy-root" data-policy-type="{{ policy_type }}" class="max-w-3xl mx-auto px-4 py-10 space-y-4">
    <div class="flex justify-end gap-2">
        <button id="agree-top" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">돌아가기</button>
        <a href="/accounts/auth/?mode=signup" class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300">회원가입</a>
    </div>

    <h1 class="text-2xl font-bold mb-2">{{ title }}</h1>
    <article class="bg-white shadow rounded-lg p-6 text-sm leading-relaxed">
        <pre class="whitespace-pre-wrap break-words">{{ content }}</pre>
    </article>

    <div class="flex justify-end gap-2">
        <button id="agree-bottom" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">돌아가기</button>
        <a href="/accounts/auth/?mode=signup" class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300">회원가입</a>
    </div>
</main>

<script>
  function goBack(andFlag) {
    if (andFlag) {
      const root = document.getElementById('policy-root');
      const policyType = root ? root.dataset.policyType : '';
      if (policyType) {
        sessionStorage.setItem(`policy_agreed_${policyType}`, 'true');
      }
    }
    if (document.referrer) {
      history.back();
    } else {
      window.location.href = '/accounts/auth/?mode=signup';
    }
  }
  ['agree-top','agree-bottom'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('click', () => goBack(true));
  });
</script>
{% endblock %}
