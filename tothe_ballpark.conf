server {
    listen 80;
    server_name _;

    location /static/ {
        alias /home/ubuntu/tothe_ballpark/staticfiles/;
    }

    location / {
        include uwsgi_params;
        uwsgi_pass unix:/home/ubuntu/tothe_ballpark/tmp/baseball.sock;
    }

    # Restrict admin to allowed IPs; add/adjust allow lines as needed.
    location /admin/ {
        allow 127.0.0.1;
        # allow <YOUR_ADMIN_IP>;
        deny all;

        include uwsgi_params;
        uwsgi_pass unix:/home/ubuntu/tothe_ballpark/tmp/baseball.sock;
    }
}
